<section
  class="viewport"
  aria-label="Farm di mining 3D"
>
  <canvas
    #canvas
    aria-label="Farm 3D. Clicca un RIG per inquadrarlo; doppio clic per configurarlo. Clicca una GPU per selezionarla; doppio clic per portarla al banco. Tasto destro su una GPU per aprire le azioni. Clicca il computer per Shop e Magazzino. Trascina per ruotare, tasto destro e trascina per spostare la visuale, rotella per zoom."
    tabindex="0"
  ></canvas>

  <app-scene-context-menu
    [context]="contextMenu()"
    [world]="game.world()"
    [disabled]="game.isGpuMining(contextMenu()?.id ?? -1)"
    [feedback]="contextFeedback()"
    (close)="closeContextMenu($event)"
    (action)="handleContextAction($event)"
  />
  @if (contextNotice()) {
    <div
      class="gpu-context-notice"
      role="status"
      aria-live="polite"
    >
      {{ contextNotice() }}
    </div>
  }

  <app-scene-controls
    [cameraPreset]="cameraPreset()"
    [selectedToolStationId]="selectedToolStationId()"
    (cameraPresetChange)="setCameraPreset($event)"
    (selectedToolStationIdChange)="setSelectedToolStationId($event)"
  />

  @if (unavailable()) {
    <div
      class="webgl-error"
      role="alert"
    >
      <app-icon name="info" />
      <strong>Vista 3D non disponibile</strong>
      <p>Controlla il caricamento degli asset e l'accelerazione grafica, poi ricarica la pagina.</p>
    </div>
  }
</section>
