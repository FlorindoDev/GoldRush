<section class="viewport" aria-label="Mondo di mining 3D">
  <canvas
    #canvas
    aria-label="Laboratorio 3D. Clicca una GPU nel mining rig per portarla al banco. Trascina per ruotare, tasto destro e trascina per spostare la visuale, rotella per zoom."
    tabindex="0"
  ></canvas>

  <app-scene-controls
    [cameraPreset]="cameraPreset()"
    [selectedToolStationId]="selectedToolStationId()"
    (cameraPresetChange)="setCameraPreset($event)"
    (selectedToolStationIdChange)="setSelectedToolStationId($event)"
  />

  @if (unavailable()) {
    <div class="webgl-error" role="alert">
      <app-icon name="info" />
      <strong>Vista 3D non disponibile</strong>
      <p>Attiva l'accelerazione grafica del browser.</p>
    </div>
  }
</section>
